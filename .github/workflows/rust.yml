# The Windows side: formatting and the Rust tests, on Windows because that is what the app is built
# for. Only when the Rust code changes, since a Windows machine counts double against the free
# minutes. The app embeds its window when it compiles, so the window is built first.

name: Rust

on:
  pull_request:
    paths: ['src-tauri/**', '.github/workflows/rust.yml']
  push:
    branches: [main]
    paths: ['src-tauri/**', '.github/workflows/rust.yml']

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

# The token can only read.
permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      # The two actions from outside GitHub are pinned to the commit their tag or branch stood at,
      # so a moved tag can't change what runs here.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      # The release build's own behaviour (the one site, the allow-list) has tests behind the feature.
      - run: cargo test --features public
        working-directory: src-tauri
