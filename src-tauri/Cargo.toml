[package]
name = "widsith-uploader"
version = "0.4.6"
description = "Sends your Widsith recordings to the site after you play."
authors = ["Widsith"]
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
# Without its zip reader: the update feed names the plain signed installer (scripts in the site
# write it as Widsith-Uploader-<version>-setup.exe, never a zip), and the zip crate carried
# advisories of its own. TLS and the system proxy stay on, as in the plugin's defaults.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

[target.'cfg(windows)'.dependencies]
# Reads which browser Windows opens web links in, to name it in the window.
winreg = "0.56"
# Tells a network drive from a local one, so looking for the game never waits on a dead share.
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_WindowsProgramming"] }

[features]
# A build that is handed out: it talks to the one real site whatever the environment says.
public = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
